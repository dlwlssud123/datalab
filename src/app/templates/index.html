<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Synergy Maker</title>
    
    <!-- React 18 & ReactDOM & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS with Typography & Leaflet & Marked -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Pretendard Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        #map { height: 600px; width: 100%; border-radius: 1rem; z-index: 10; }
        .leaflet-pane { z-index: 10 !important; }
        
        /* 공문서 마크다운 스타일 (가독성 극대화) */
        #reportHtmlArea h1 { font-size: 1.6rem; font-weight: 800; color: #0f172a; margin-top: 1.5rem; margin-bottom: 0.85rem; border-bottom: 2.5px solid #2563eb; padding-bottom: 0.4rem; }
        #reportHtmlArea h2 { font-size: 1.35rem; font-weight: 700; color: #1e293b; margin-top: 1.3rem; margin-bottom: 0.6rem; }
        #reportHtmlArea h3 { font-size: 1.15rem; font-weight: 700; color: #334155; margin-top: 1.1rem; margin-bottom: 0.5rem; }
        #reportHtmlArea p { font-size: 0.95rem; margin-bottom: 0.85rem; line-height: 1.8; color: #334155; }
        #reportHtmlArea ul { list-style-type: disc; padding-left: 1.6rem; margin-bottom: 0.85rem; font-size: 0.95rem; }
        #reportHtmlArea li { margin-bottom: 0.35rem; line-height: 1.7; }
        #reportHtmlArea strong { font-weight: 700; color: #1e3a8a; }
        #reportHtmlArea hr { border-color: #cbd5e1; margin: 1.5rem 0; }
        #reportHtmlArea blockquote { border-left: 4px solid #2563eb; padding-left: 1.2rem; color: #334155; background: #f1f5f9; padding-top: 0.6rem; padding-bottom: 0.6rem; border-radius: 0.35rem; font-size: 0.95rem; }
        #reportHtmlArea table { width: 100%; border-collapse: collapse; margin-bottom: 1.2rem; font-size: 0.9rem; }
        #reportHtmlArea th, #reportHtmlArea td { border: 1px solid #cbd5e1; padding: 0.65rem 0.85rem; }
        #reportHtmlArea th { background: #f8fafc; font-weight: bold; color: #1e293b; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    <div id="root"></div>

    {% raw %}

            'geoje_jungle_dome': {

                busIntervalText: '중앙 배차 120분',
                busDesc: '식물원/외간교회 정류장 기준 자동 산출, 목적지 접근 방향 배차가 긴 편',
                taxiDistance: '12.4 km',
                taxiTime: '약 16분',
                taxiOneWay: '약 15,000원',
                taxiRound: '(왕복 약 30,000원)',
                taxiDesc: '도심에서 비교적 가까우나 버스 배차가 길어 이동 단절 발생',
                totalStores: '215개소 (면소재지 상권)',
                overcrowded: '전통 한식 44% + 농자재·소매 35%',
                deficit: '관광 연계 디저트·체험 4.8%',
                ceiTag: 'CEI 0.82 (면소재지)',
                origInterval: 120,
                origTii: 0.83,
                origCei: 0.82
            }
        };

        const SPOT_COMMERCIAL_ANALYSIS = {
            'maemi_castle': {
                badge: '카페 편중률 64.1%',
                deficits: [
                    '로컬 스토리텔링 굿즈·기념품 숍 (결핍도 95%): 성곽 관람 후 기념품 구매처 전무',
                    '실내 문화·체험 공방 (결핍도 92%): 야외 포토존 외 우천/혹서기 보행 쉼터 결핍'
                ],
                bestCategory: '청년 해양 공방 & 로컬 굿즈 편집숍',
                categoryVal: 'craft_shop',
                synergy: '체류시간 +4.9시간 견인',
                reason: '바다 조망 카페에만 편중된 2030 관광객에게 체험과 기념품 구매 2차 보행 소비 동선을 제공하여 체류시간 극대화.'
            },
            'wind_hill': {
                badge: '횟집·숙박 과밀률 85.9%',
                deficits: [
                    '청년 타깃 트렌디 F&B (결핍도 96%): 횟집 일색으로 2030 단품 식음료(타파스/디저트) 결핍',
                    '독립서점 & 감성 쉼터 (결핍도 98%): 바람의 언덕 조망 후 여유롭게 머물 힐링 문화공간 전무'
                ],
                bestCategory: '거제 특산물 F&B (유자/해양 타파스 바)',
                categoryVal: 'local_fnb',
                synergy: '체류시간 +4.9시간 견인',
                reason: '사진만 찍고 빠져나가는 당일치기 관광객을 도장포 포구 1km 보행권 내 로컬 식음료 공간에 안착시켜 소비 지출 증대.'
            },
            'hakdong_pebble': {
                badge: '공실률: 경남 집합상가 12.7% 기준',
                deficits: [
                    '사계절 복합 문화공간 (결핍도 89%): 여름 해수욕 외 비수기 방문 유인 시설 전무',
                    '로컬 크래프트 숍 (결핍도 85%): 몽돌 테마 업사이클링 공예 시설 부족'
                ],
                bestCategory: '독립 서점 & 로컬 복합 문화공간',
                categoryVal: 'culture_book',
                synergy: '체류시간 +3.8시간 견인',
                reason: '해수욕장 비수기(가을~봄)에도 관광객이 유입될 수 있는 실내 문화 앵커 시설을 몽돌해변 1km 배후에 구축.'
            },
            'geoje_jungle_dome': {
                badge: '상권 연계성 12%',
                deficits: [
                    '온실 테마 연계 카페/체험 (결핍도 90%): 식물원 관람 후 면소재지 상권으로 이어지는 연결고리 부재',
                    '농특산물 파머스 마켓 (결핍도 84%): 거제면 농산물 가공 굿즈 판매처 부족'
                ],
                bestCategory: '거제 특산물 F&B (식물원 연계 디저트)',
                categoryVal: 'local_fnb',
                synergy: '체류시간 +3.5시간 견인',
                reason: '가족 단위 방문객의 돔 관람 후 즉시 귀가 현상을 차단하고, 면소재지 로컬 디저트·파머스 마켓 소비로 연결.'
            }
        };

        const getBusSourceLabel = (source) => {
            if (source === 'excel_auto') return '엑셀 자동 산출';
            if (source === 'fallback') return '기준값 유지';
            return '기준 데이터';
        };

        const getBusEvidenceText = (spot) => {
            if (!spot.bus_schedule_source) return '';
            const sourceLabel = getBusSourceLabel(spot.bus_schedule_source);
            if (spot.bus_schedule_source === 'fallback') {
                return sourceLabel + (spot.bus_schedule_note ? ' · ' + spot.bus_schedule_note : '');
            }
            const runText = spot.observed_runs_count ? ' · 관측 ' + spot.observed_runs_count + '회' : '';
            const timeText = spot.first_bus_time && spot.last_bus_time ? ' · ' + spot.first_bus_time + '~' + spot.last_bus_time : '';
            return sourceLabel + runText + timeText;
        };

        const getTiiEvidenceHtml = (spot) => {
            if (!spot.tii_formula_basis) return '';
            const demand = spot.tii_demand_pressure ? Number(spot.tii_demand_pressure).toLocaleString() : null;
            const supply = spot.tii_supply_index ? Number(spot.tii_supply_index).toFixed(2) : null;
            const parts = [];
            if (demand) parts.push('수요압력 ' + demand);
            if (supply) parts.push('공급지수 ' + supply);
            if (spot.walk_distance_m) parts.push('도보 ' + spot.walk_distance_m + 'm');
            const detail = parts.length ? '<br/><span style="color: #64748b; font-size: 12px;">' + parts.join(' · ') + '</span>' : '';
            return '<div style="margin-top: 4px; color: #475569;">TII 근거: <b>' + spot.tii_formula_basis + '</b>' + detail + '</div>';
        };

        function App() {
            const [spots, setSpots] = useState([]);
            const [selectedSpotId, setSelectedSpotId] = useState('maemi_castle');
            const [activeTab, setActiveTab] = useState('fusion');
            const [shuttleCount, setShuttleCount] = useState(2);
            const [storeCategory, setStoreCategory] = useState('craft_shop');
            const [storeCount, setStoreCount] = useState(2);
            const [fusionResult, setFusionResult] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isReportLoading, setIsReportLoading] = useState(false);
            const [reportMarkdown, setReportMarkdown] = useState('');
            const [modelUsed, setModelUsed] = useState('');

            const mapRef = useRef(null);
            const routeLineRef = useRef(null);
            const markersRef = useRef([]);

            const currentProfile = REAL_SPOT_PROFILES[selectedSpotId] || REAL_SPOT_PROFILES['maemi_castle'];
            const currentSpotData = spots.find(spot => spot.id === selectedSpotId);
            const currentCommAnalysis = SPOT_COMMERCIAL_ANALYSIS[selectedSpotId] || SPOT_COMMERCIAL_ANALYSIS['maemi_castle'];

            useEffect(() => {
                if (currentCommAnalysis) {
                    setStoreCategory(currentCommAnalysis.categoryVal);
                }
            }, [selectedSpotId]);

            useEffect(() => {
                if (!mapRef.current) {
                    const mapInstance = L.map('map').setView([34.8806, 128.6211], 11);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 18,
                        attribution: '© OpenStreetMap'
                    }).addTo(mapInstance);
                    mapRef.current = mapInstance;
                }

                fetch('/api/spots')
                    .then(res => res.json())
                    .then(data => {
                        setSpots(data);
                        markersRef.current.forEach(m => mapRef.current.removeLayer(m));
                        markersRef.current = [];

                        data.forEach(spot => {
                            let color = '#10B981';
                            if (spot.status === 'hub') color = '#2563EB';
                            else if (spot.status === 'isolated') color = '#EF4444';

                            const marker = L.circleMarker([spot.lat, spot.lng], {
                                radius: 10,
                                fillColor: color,
                                color: '#FFFFFF',
                                weight: 2.5,
                                fillOpacity: 0.9
                            }).addTo(mapRef.current);

                            const busEvidence = getBusEvidenceText(spot);
                            const busBasis = spot.bus_stop_basis
                                ? '<div style="color: #475569;">산출 기준: <b>' + spot.bus_stop_basis + '</b></div>'
                                : '';
                            const busRoutes = spot.bus_route_numbers
                                ? '<div style="color: #475569;">노선: <b>' + spot.bus_route_numbers + '</b></div>'
                                : '';
                            const busEvidenceHtml = busEvidence
                                ? '<div style="margin-top: 4px; color: #64748b; font-size: 12px;">' + busEvidence + '</div>' + busBasis + busRoutes
                                : '';
                            const vacancyEvidenceHtml = spot.vacancy_rate_pct
                                ? '<div style="margin-top: 4px; color: #475569; font-size: 12px;">공실률 기준: <b>' + spot.vacancy_rate_pct + '%</b> <span style="color: #64748b;">(' + spot.vacancy_market_name + ' ' + spot.vacancy_rate_quarter + ')</span></div>'
                                : '';

                            marker.bindPopup(`
                                <div style="padding: 4px; font-size: 13px; line-height: 1.5;">
                                    <strong style="font-size: 14px; color: #0f172a;">${spot.name}</strong><br/>
                                    <span style="color: #64748b;">${spot.description}</span><br/>
                                    <hr style="margin: 6px 0; border-color: #e2e8f0;"/>
                                    <div>버스 배차: <b>${spot.bus_interval_min}분</b></div>
                                    ${busEvidenceHtml}
                                    <div>교통 고립도(TII): <b style="color: #dc2626;">${spot.tii_score}</b></div>
                                    <div>상권 다양성(CEI): <b style="color: #4f46e5;">${spot.cei_score}</b></div>
                                    ${vacancyEvidenceHtml}
                                    <div>월간 방문객: <b>${Number(spot.visitors_monthly).toLocaleString()}명</b></div>
                                </div>
                            `);
                            markersRef.current.push(marker);
                        });
                    })
                    .catch(err => console.error(err));
            }, []);

            const handleSelectSpot = (spotId) => {
                setSelectedSpotId(spotId);
                const spotObj = spots.find(s => s.id === spotId);
                if (spotObj && mapRef.current) {
                    mapRef.current.flyTo([spotObj.lat, spotObj.lng], 13, { duration: 1.2 });
                }
            };

            const runFusionSimulation = async () => {
                try {
                    const trafRes = await fetch('/api/simulate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ target_spot_id: selectedSpotId, shuttle_count: shuttleCount })
                    });
                    const trafData = await trafRes.json();

                    const commRes = await fetch('/api/simulate-commercial', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            target_town: currentProfile.town,
                            store_category: storeCategory,
                            new_store_count: storeCount
                        })
                    });
                    const commData = await commRes.json();

                    const newInterval = trafData.new_interval_min;
                    const baselineInterval = Number(currentSpotData?.bus_interval_min ?? currentProfile.origInterval);
                    const baselineTii = Number(currentSpotData?.tii_score ?? currentProfile.origTii);
                    const baselineCei = Number(currentSpotData?.cei_score ?? currentProfile.origCei);
                    const deltaInterval = baselineInterval - newInterval;
                    const newTii = Math.max(0.1, Number((baselineTii * (newInterval / baselineInterval)).toFixed(2)));
                    const tiiImprovePct = Math.round(((baselineTii - newTii) / baselineTii) * 100);

                    const newCei = commData.simulated_cei;
                    const deltaCei = Math.max(0, newCei - baselineCei);

                    const stayGainFromInterval = 2.13 * deltaInterval;
                    const stayGainFromCei = 411.8 * deltaCei;
                    const deltaVacancy = Math.max(0, Number(commData.vacancy_change_pctp ?? 0) / 100);
                    const stayGainFromVac = 121.9 * deltaVacancy;
                    const totalStayGain = Math.round(stayGainFromInterval + stayGainFromCei + stayGainFromVac + 10.06);

                    if (routeLineRef.current && mapRef.current) {
                        mapRef.current.removeLayer(routeLineRef.current);
                    }
                    if (mapRef.current) {

                                                        <option value="culture_book">🟢 [로컬 특화] 독립 서점 & 로컬 복합 문화공간</option>
                                                        <option value="franchise_copy">🔴 [복제 업종] 전국 프랜차이즈 / 무인 사진관</option>
                                                    </select>
                                                </div>

                                                <div>
                                                    <div className="flex justify-between items-center mb-1.5">
                                                        <span className="text-sm font-bold text-slate-800">4. 지원 점포 수:</span>
                                                        <span className="text-lg font-black text-purple-600">{storeCount}개소</span>
                                                    </div>
                                                    <input type="range" min="1" max="5" value={storeCount}
                                                        onChange={(e) => setStoreCount(Number(e.target.value))}
                                                        className="w-full h-2.5 bg-purple-200 rounded-lg appearance-none cursor-pointer accent-purple-600" />
                                                </div>
                                            </div>

                                            {/* 🚀 시뮬레이션 실행 대형 버튼 */}
                                            <button onClick={runFusionSimulation}
                                                className="w-full py-4 px-5 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-black text-base md:text-lg rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center space-x-2">
                                                <span>🚀</span>
                                                <span>TII × CEI 융합 시뮬레이션 실행</span>
                                            </button>

                                            {/* 시뮬레이션 결과 카드 (글씨 크기 시원하게) */}
                                            {fusionResult && (
                                                <div className="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 border-2 border-indigo-300 p-5 rounded-2xl shadow-md space-y-3.5 animate-fade-in">
                                                    <div className="text-indigo-950 font-bold text-xs leading-relaxed bg-white/80 p-3 rounded-xl border border-indigo-100">
                                                        [{fusionResult.spotName}] 주말 직통 셔틀 {shuttleCount}대 투입 + 반경 500m~1km 보행 벨트 내 '{fusionResult.categoryName}' {fusionResult.storeCount}개소 입점 지원 시, 교통 단절이 완화되고 상권이 다변화되어 체류시간이 획기적으로 증가합니다.
                                                    </div>

                                                    {/* 메트릭스 그리드 */}
                                                    <div className="grid grid-cols-2 gap-3">
                                                        <div className="bg-white p-3.5 rounded-xl shadow-sm border border-blue-200">
                                                            <span className="text-slate-500 text-xs font-semibold">TII 고립도 개선:</span>
                                                            <div className="text-lg font-black text-blue-600 mt-0.5">
                                                                {fusionResult.origTii} → {fusionResult.newTii}
                                                                <span className="text-xs text-blue-500 ml-1">(-{fusionResult.tiiImprovePct}%)</span>
                                                            </div>
                                                            <div className="text-xs text-slate-400 mt-1">배차 {fusionResult.origInterval}분 → {fusionResult.newInterval}분</div>
                                                        </div>

                                                        <div className="bg-white p-3.5 rounded-xl shadow-sm border border-indigo-200">
                                                            <span className="text-slate-500 text-xs font-semibold">상권 다양성(CEI):</span>
                                                            <div className="text-lg font-black text-indigo-600 mt-0.5">
                                                                {fusionResult.origCei} → {fusionResult.newCei}
                                                                <span className="text-xs text-indigo-500 ml-1">(+{fusionResult.ceiChangePct}%)</span>
                                                            </div>
                                                            <div className="text-xs text-slate-400 mt-1">공실률 {fusionResult.origVacancyRate}% → {fusionResult.newVacancyRate}% 추정</div>
                                                            <div className="text-[10px] text-slate-400 mt-0.5 leading-snug">{fusionResult.vacancyRateBasis}</div>
                                                        </div>

                                                        {/* 체류시간 증가 하이라이트 (초대형 글자) */}
                                                        <div className="bg-white p-4 rounded-xl shadow-sm border-2 border-emerald-300 col-span-2">
                                                            <div className="flex justify-between items-center">
                                                                <span className="text-slate-700 font-extrabold text-sm flex items-center">
                                                                    <span className="mr-1.5">🎯</span> 체류시간 증가 추정:
                                                                </span>
                                                                <span className="text-2xl md:text-3xl font-black text-emerald-600">
                                                                    +{fusionResult.totalStayGain}분
                                                                    <span className="text-sm md:text-base font-bold text-emerald-500 ml-1.5">
                                                                        (약 +{(fusionResult.totalStayGain / 60).toFixed(1)}h)
                                                                    </span>
                                                                </span>
                                                            </div>
                                                            <div className="text-xs text-slate-400 font-mono mt-1.5 border-t border-slate-100 pt-1.5">
                                                                {fusionResult.formulaText}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {/* AI 보고서 생성 버튼 */}
                                                    <button onClick={generateAiReport}
                                                        className="w-full py-4 px-4 bg-gradient-to-r from-purple-600 to-indigo-700 hover:from-purple-700 hover:to-indigo-800 text-white font-extrabold text-base rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                                                        <span className="text-xl">📑</span>
                                                        <span>AI 맞춤형 TII×CEI 융합 정책 자문서 생성 (Claude)</span>
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* [탭 2] 교통 단독 */}
                                    {activeTab === 'traffic' && (
                                        <div className="space-y-4 p-5 bg-blue-50/60 rounded-xl border border-blue-100">
                                            <h4 className="font-extrabold text-base text-blue-950">🚌 도심 ↔ 외곽 관광 셔틀 단독 분석</h4>
                                            <div>
                                                <label className="block text-sm font-bold text-slate-700 mb-1">대상 고립지:</label>
                                                <select value={selectedSpotId} onChange={(e) => handleSelectSpot(e.target.value)}
                                                    className="w-full p-2.5 border rounded-lg bg-white text-base font-bold">
                                                    <option value="maemi_castle">매미성 (장목면)</option>
                                                    <option value="wind_hill">바람의 언덕 (남부면)</option>
                                                    <option value="hakdong_pebble">학동 흑진주 몽돌해변 (동부면)</option>
                                                    <option value="geoje_jungle_dome">거제 정글돔 (거제면)</option>
                                                </select>
                                            </div>
                                            <p className="text-xs text-slate-500">교통과 상권을 동시에 시뮬레이션하시려면 <strong>[✨ TII×CEI 융합 정책]</strong> 탭을 권장합니다.</p>
                                        </div>
                                    )}

                                    {/* [탭 3] 상권 단독 */}
                                    {activeTab === 'commercial' && (
                                        <div className="space-y-4 p-5 bg-purple-50/60 rounded-xl border border-purple-100">
                                            <h4 className="font-extrabold text-base text-purple-950">🏪 상권 다양성(CEI) 단독 분석</h4>
                                            <div>
                                                <label className="block text-sm font-bold text-slate-700 mb-1">대상 상권:</label>
                                                <select value={currentProfile.town} onChange={() => {}}
                                                    className="w-full p-2.5 border rounded-lg bg-white text-base font-bold">
                                                    <option value="장목면">장목면 (매미성 1km 상권)</option>
                                                    <option value="남부면">남부면 (바람의 언덕 1km 상권)</option>
                                                    <option value="동부면">동부면 (몽돌해변 1km 상권)</option>
                                                </select>
                                            </div>
                                            <p className="text-xs text-slate-500">교통과 상권을 동시에 시뮬레이션하시려면 <strong>[✨ TII×CEI 융합 정책]</strong> 탭을 권장합니다.</p>
                                        </div>
                                    )}
                                </div>

                                <div className="pt-4 border-t border-slate-200 text-xs text-slate-400 text-center mt-5">
                                    2026 한국관광 데이터랩 경진대회 | 거제시 B2G 모델
                                </div>
                            </div>

                        </div>
                    </main>

                    {/* 📑 AI 정책 제언서 팝업 모달 */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4"
                            style={{ zIndex: 99999 }}>
                            <div className="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[90vh] flex flex-col overflow-hidden border border-slate-200">
                                {/* 모달 헤더 */}
                                <div className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-5 flex justify-between items-center shadow">
                                    <div className="flex items-center space-x-3">
                                        <span className="text-2xl">📑</span>
                                        <div>
                                            <h3 className="font-extrabold text-lg">거제시정 반영용 AI 관광·교통 융합 정책 자문서</h3>
                                            <p className="text-xs text-blue-200">{modelUsed || 'Claude-sonnet-5 (영남대 Mindlogic AI Gateway)'}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setIsModalOpen(false)}
                                        className="text-slate-300 hover:text-white text-2xl font-bold p-1">&times;</button>
                                </div>

                                {/* 로딩 인디케이터 */}
                                {isReportLoading ? (
                                    <div className="p-16 text-center space-y-4">
                                        <div className="animate-spin rounded-full h-14 w-14 border-4 border-indigo-600 border-t-transparent mx-auto"></div>
                                        <div className="text-base font-bold text-slate-800">TII×CEI 기준지표와 정책효과 추정식을 바탕으로 행정 기획서 작성 중...</div>
                                        <div className="text-xs text-slate-400">거제시 외곽 관광지 교통 단절 해소 및 500m~1km 보행 벨트 상권 정책 제언</div>
                                    </div>
                                ) : (
                                    /* 보고서 본문 내용 */
                                    <div className="flex-1 overflow-y-auto p-6 text-slate-800">
                                        <div id="reportHtmlArea" 
                                            className="prose max-w-none text-slate-800 leading-relaxed"
                                            dangerouslySetInnerHTML={{ __html: marked.parse(reportMarkdown) }} />
                                    </div>
                                )}

                                {/* 모달 푸터 */}
                                <div className="bg-slate-50 border-t border-slate-200 p-4 flex justify-between items-center">
                                    <span className="text-xs text-slate-500 font-medium">한국관광 데이터랩 경진대회 [서식 4] B2G 특화 증빙자료</span>
                                    <div className="space-x-2">
                                        <button onClick={copyReportText}
                                            className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg text-xs shadow transition">
                                            📋 전문 복사
                                        </button>
                                        <button onClick={() => setIsModalOpen(false)}
                                            className="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-2 px-4 rounded-lg text-xs transition">
                                            닫기
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    {% endraw %}
</body>
</html>
