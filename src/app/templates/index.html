<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map { height: 720px; width: 100%; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-blue-600 text-white shadow-md p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">🌊 Local Synergy Maker</h1>
                <p class="text-xs text-blue-200 mt-1">한국관광 데이터랩 빅데이터 기반 거제시 교통 고립지 및 상권 시뮬레이터</p>
            </div>
            <span class="text-sm bg-blue-700 px-3 py-1 rounded-full font-medium">B2G 실증 모델</span>
        </div>
    </header>

    <main class="container mx-auto mt-6 p-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- 왼쪽: 지도 영역 (2칸) -->
            <div class="lg:col-span-2 bg-white p-4 rounded-lg shadow-lg flex flex-col justify-between">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-bold text-gray-800">🗺️ 거제시 관광 거점 진단 & 노선 시뮬레이션</h2>
                    <div class="flex items-center space-x-3 text-xs">
                        <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-blue-500 inline-block mr-1"></span>도심 거점</span>
                        <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-red-500 inline-block mr-1"></span>교통 고립지(위험)</span>
                        <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block mr-1"></span>일반 명소</span>
                    </div>
                </div>
                <div id="map"></div>
            </div>

            <!-- 오른쪽: 컨트롤러 및 시뮬레이션 패널 (1칸) -->
            <div class="bg-white p-4 rounded-lg shadow-lg flex flex-col justify-between h-[720px]">
                
                <!-- 상단: 셔틀 시뮬레이터 조작기 -->
                <div class="border-b pb-4">
                    <h2 class="text-base font-bold text-gray-800 mb-3 flex items-center">
                        <span class="mr-2">🚌</span> 스마트 셔틀 시뮬레이터
                    </h2>
                    
                    <div class="space-y-3 bg-blue-50 p-3 rounded-lg border border-blue-100 text-xs">
                        <div>
                            <label class="block font-semibold text-gray-700 mb-1">1. 연계할 외곽 고립지 선택:</label>
                            <select id="simTarget" class="w-full p-2 border rounded bg-white text-gray-800 font-medium">
                                <option value="wind_hill">바람의 언덕 / 신선대 (남부면)</option>
                                <option value="maemi_castle">매미성 (장목면)</option>
                                <option value="gujora_beach">구조라 해수욕장 (일운면)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block font-semibold text-gray-700 mb-1">
                                2. 주말 탄력 셔틀 투입 대수: <span id="busCountVal" class="text-blue-600 font-bold">2대</span>
                            </label>
                            <input type="range" id="simCount" min="1" max="5" value="2" class="w-full cursor-pointer"
                                oninput="document.getElementById('busCountVal').innerText = this.value + '대'">
                            <div class="flex justify-between text-[10px] text-gray-500">
                                <span>1대 (최소)</span>
                                <span>3대 (적정)</span>
                                <span>5대 (집중)</span>
                            </div>
                        </div>

                        <button onclick="runSimulation()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-150 shadow">
                            ⚡ 시뮬레이션 실행하기
                        </button>
                    </div>
                </div>

                <!-- 중단: 시뮬레이션 결과 리포트 카드 (결과가 나오면 표시) -->
                <div id="simResultCard" class="my-3 flex-1 overflow-y-auto hidden">
                    <h3 class="text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">📈 시뮬레이션 산출 성과</h3>
                    <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-lg space-y-2 text-xs">
                        <div class="text-emerald-900 font-bold text-sm" id="resSummary"></div>
                        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-emerald-200">
                            <div class="bg-white p-2 rounded shadow-sm">
                                <span class="text-gray-500">배차 단축:</span>
                                <div class="text-base font-extrabold text-blue-600" id="resInterval"></div>
                            </div>
                            <div class="bg-white p-2 rounded shadow-sm">
                                <span class="text-gray-500">대기시간 절감:</span>
                                <div class="text-base font-extrabold text-emerald-600" id="resTimeSaved"></div>
                            </div>
                            <div class="bg-white p-2 rounded shadow-sm">
                                <span class="text-gray-500">예상 추가 유입:</span>
                                <div class="text-base font-extrabold text-purple-600" id="resVisitors"></div>
                            </div>
                            <div class="bg-white p-2 rounded shadow-sm">
                                <span class="text-gray-500">탄소 배출 저감:</span>
                                <div class="text-base font-extrabold text-teal-600" id="resCarbon"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 하단: 거점 목록 안내창 -->
                <div class="pt-2 border-t text-[11px] text-gray-400 text-center">
                    2026 한국관광 데이터랩 경진대회 | 거제시 B2G 모델
                </div>
            </div>

        </div>
    </main>

    <script>
        // 1. 지도 초기화
        const map = L.map('map').setView([34.8806, 128.6211], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let shuttleRouteLine = null; // 셔틀 노선 폴리라인 객체

        // 2. 거점 데이터 로드 (GET /api/spots)
        async function loadSpots() {
            try {
                const res = await fetch('/api/spots');
                const spots = await res.json();

                spots.forEach(spot => {
                    let color = '#10B981';
                    if (spot.status === 'hub') color = '#3B82F6';
                    else if (spot.status === 'isolated') color = '#EF4444';

                    const marker = L.circleMarker([spot.lat, spot.lng], {
                        radius: 10,
                        fillColor: color,
                        color: '#FFFFFF',
                        weight: 2,
                        fillOpacity: 0.85
                    }).addTo(map);

                    marker.bindPopup(`
                        <div class="p-1 text-xs">
                            <h3 class="font-bold text-sm text-gray-900 mb-1">${spot.name}</h3>
                            <p class="text-gray-600 mb-2">${spot.description}</p>
                            <div class="space-y-1 bg-gray-50 p-2 rounded border">
                                <div>배차간격: <strong>${spot.bus_interval_min}분</strong></div>
                                <div>교통고립도(TII): <strong class="text-purple-700">${spot.tii_score}</strong></div>
                                <div>상권다양성(CEI): <strong class="text-indigo-700">${spot.cei_score}</strong></div>
                                <div>월간 방문자: <strong>${spot.visitors_monthly.toLocaleString()}명</strong></div>
                            </div>
                        </div>
                    `);
                });
            } catch (err) {
                console.error("거점 로드 실패:", err);
            }
        }

        // 3. 🌟 스마트 셔틀 시뮬레이션 실행 (POST /api/simulate)
        async function runSimulation() {
            const targetId = document.getElementById('simTarget').value;
            const count = parseInt(document.getElementById('simCount').value);

            try {
                const res = await fetch('/api/simulate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target_spot_id: targetId, shuttle_count: count })
                });
                const data = await res.json();

                // (1) 산출 결과 UI 업데이트
                document.getElementById('simResultCard').classList.remove('hidden');
                document.getElementById('resSummary').innerText = data.synergy_summary;
                document.getElementById('resInterval').innerText = `${data.original_interval_min}분 → ${data.new_interval_min}분`;
                document.getElementById('resTimeSaved').innerText = `-${data.time_saved_percent}%`;
                document.getElementById('resVisitors').innerText = `+${data.expected_new_visitors.toLocaleString()}명`;
                document.getElementById('resCarbon').innerText = `-${data.carbon_reduction_kg}kg`;

                // (2) 지도 위에 셔틀버스 노선(점선 폴리라인) 그리기!
                if (shuttleRouteLine) {
                    map.removeLayer(shuttleRouteLine); // 기존 노선 지우기
                }

                shuttleRouteLine = L.polyline([data.origin_coords, data.target_coords], {
                    color: '#2563EB',
                    weight: 5,
                    opacity: 0.8,
                    dashArray: '8, 8' // 점선 효과
                }).addTo(map);

                // 두 거점이 모두 보이도록 카메라 줌 조절
                map.fitBounds(shuttleRouteLine.getBounds(), { padding: [50, 50] });

            } catch (err) {
                console.error("시뮬레이션 실패:", err);
                alert("시뮬레이션 실행 중 오류가 발생했습니다.");
            }
        }

        loadSpots();
    </script>
</body>
</html>
