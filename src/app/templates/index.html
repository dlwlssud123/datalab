            const [storeCategory, setStoreCategory] = useState('craft_shop');
            const [storeCount, setStoreCount] = useState(2);
            
            const [fusionResult, setFusionResult] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);

            const routeLineRef = useRef(null);
            const markersRef = useRef([]);

            const currentProfile = REAL_SPOT_PROFILES[selectedSpotId] || REAL_SPOT_PROFILES['maemi_castle'];
            const currentCommAnalysis = SPOT_COMMERCIAL_ANALYSIS[selectedSpotId] || SPOT_COMMERCIAL_ANALYSIS['maemi_castle'];

            useEffect(() => {
                if (currentCommAnalysis) {
                    setStoreCategory(currentCommAnalysis.categoryVal);
                }
            }, [selectedSpotId]);

            useEffect(() => {
                if (!mapRef.current) {
                    const mapInstance = L.map('map').setView([34.8806, 128.6211], 11);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 18,
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(mapInstance);
                    mapRef.current = mapInstance;
                }

                fetch('/api/spots')
                    .then(res => res.json())
                    .then(data => {
                        setSpots(data);
                        markersRef.current.forEach(m => mapRef.current.removeLayer(m));
                        markersRef.current = [];

                        data.forEach(spot => {
                            let color = '#475569'; // 도심 기본 Slate
                            if (spot.status === 'hub') color = '#0f172a'; // 도심 Deep Navy
                            else if (spot.status === 'isolated') color = '#be123c'; // 고립지 Rose
                            else color = '#0d9488'; // 일반 명소 Teal

                            const marker = L.circleMarker([spot.lat, spot.lng], {
                                radius: 8,
                                fillColor: color,
                                color: '#FFFFFF',
                                weight: 2,
                                fillOpacity: 0.95
                            }).addTo(mapRef.current);

                            marker.bindPopup(`
                                <div style="padding: 6px; font-family: 'Pretendard', sans-serif; font-size: 12px; color: #1e293b; min-width: 200px;">

            const runFusionSimulation = async () => {
                try {
                    const trafRes = await fetch('/api/simulate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ target_spot_id: selectedSpotId, shuttle_count: shuttleCount })
                    });
                    const trafData = await trafRes.json();

                    const commRes = await fetch('/api/simulate-commercial', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            target_town: currentProfile.town,
                            store_category: storeCategory,
                            new_store_count: storeCount
                        })
                    });
                    const commData = await commRes.json();

                    const newInterval = trafData.new_interval_min;
                    const deltaInterval = currentProfile.origInterval - newInterval;
                    const newTii = Math.max(0.1, Number((currentProfile.origTii * (newInterval / currentProfile.origInterval)).toFixed(2)));
                    const tiiImprovePct = Math.round(((currentProfile.origTii - newTii) / currentProfile.origTii) * 100);

                    const newCei = commData.simulated_cei;
                    const deltaCei = Math.max(0, newCei - currentProfile.origCei);

                    const deltaVacancy = commData.vacancy_change_pctp ? Math.abs(commData.vacancy_change_pctp) : (0.03 * storeCount);
                    const stayGainFromInterval = 2.13 * deltaInterval;
                    const stayGainFromCei = 411.8 * deltaCei;
                    const stayGainFromVac = 121.9 * deltaVacancy;
                    const totalStayGain = Math.round(stayGainFromInterval + stayGainFromCei + stayGainFromVac + 10.06);

                    if (routeLineRef.current && mapRef.current) {
                        mapRef.current.removeLayer(routeLineRef.current);
                    }
                    if (mapRef.current) {
                        routeLineRef.current = L.polyline([trafData.origin_coords, trafData.target_coords], {
                            color: '#1e293b',
                            weight: 4,
                            dashArray: '6, 6'
                        }).addTo(mapRef.current);
                        mapRef.current.fitBounds(routeLineRef.current.getBounds(), { padding: [40, 40] });
                    }

                    setFusionResult({
                        spotName: currentProfile.title,
                        origInterval: currentProfile.origInterval,
                        newInterval: newInterval,
                        deltaInterval: deltaInterval,
                        origTii: currentProfile.origTii,
                        newTii: newTii,
                        tiiImprovePct: tiiImprovePct,
                        origCei: currentProfile.origCei,
                        newCei: newCei,
                        ceiChangePct: commData.cei_change_percent,
                        categoryName: commData.selected_category_name,
                        storeCount: storeCount,
                        origVacancyRate: commData.original_vacancy_rate_pct,
                        newVacancyRate: commData.simulated_vacancy_rate_pct,
                        vacancyChangePctp: commData.vacancy_change_pctp,
                        vacancyRateBasis: commData.vacancy_rate_basis,
                        totalStayGain: totalStayGain,
                        formulaText: `정책효과 추정식: ΔStay = (2.13 × ${deltaInterval}m) + (411.8 × ${deltaCei.toFixed(2)}) + (121.9 × ${deltaVacancy.toFixed(2)}) + 10.06`,
                        reportPayload: {
                            town_name: currentProfile.town,
                            spot_name: currentProfile.title,
                            original_interval: currentProfile.origInterval,
                            new_interval: newInterval,
                            original_tii: currentProfile.origTii,
                            simulated_tii: newTii,
                            category_name: commData.selected_category_name,
                            store_count: storeCount,
                            original_cei: currentProfile.origCei,
                            simulated_cei: newCei,
                            cei_change_percent: commData.cei_change_percent,

                            original_vacancy_rate_pct: commData.original_vacancy_rate_pct,
                            simulated_vacancy_rate_pct: commData.simulated_vacancy_rate_pct,
                            vacancy_change_pctp: commData.vacancy_change_pctp,
                            vacancy_rate_basis: commData.vacancy_rate_basis
                        }
                    });

                                                                <span className="text-slate-700 font-semibold">{currentProfile.ceiTag}</span>
                                                            </div>
                                                            <div className="text-slate-600 text-[11px]">• 등록 점포: {currentProfile.totalStores} | 과밀: <span className="text-slate-800 font-medium">{currentProfile.overcrowded}</span></div>
                                                            <div className="text-slate-600 text-[11px]">• 결핍 업종: <span className="text-rose-700 font-medium">{currentProfile.deficit}</span></div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* 3. 접이식 아코디언: 상권 결핍 & 최적 권장 업종 */}
                                            <div className="border border-slate-200 rounded-lg overflow-hidden">
                                                <button 
                                                    onClick={() => setIsDeficitOpen(!isDeficitOpen)}
                                                    className="w-full bg-slate-50 px-3.5 py-2.5 text-left flex justify-between items-center hover:bg-slate-100 transition">
                                                    <div className="flex items-center gap-2">
                                                        <IconSparkles className="w-4 h-4 text-indigo-700" />
                                                        <span className="text-xs font-bold text-slate-900">상권 결핍 분석 & 권장 업종</span>
                                                        <span className="text-[10px] text-indigo-700 font-medium bg-indigo-50 border border-indigo-200 px-1.5 py-0.2 rounded">
                                                            {currentCommAnalysis.bestCategory.split(' & ')[0]}
                                                        </span>
                                                    </div>
                                                    {isDeficitOpen ? <IconChevronUp className="w-3.5 h-3.5 text-slate-500" /> : <IconChevronDown className="w-3.5 h-3.5 text-slate-500" />}
                                                </button>

                                                {isDeficitOpen && (
                                                    <div className="p-3.5 bg-white space-y-2.5 text-xs border-t border-slate-200">
                                                        <div className="p-2.5 rounded bg-rose-50/50 border border-rose-100 space-y-1">
                                                            <div className="text-xs font-bold text-rose-800">결핍 상권 (조기 이탈 요인)</div>
                                                            {currentCommAnalysis.deficits.map((def, idx) => (
                                                                <div key={idx} className="text-slate-600 text-[11px] leading-relaxed">• {def}</div>
                                                            ))}
                                                        </div>

                                                        <div className="p-2.5 rounded bg-indigo-50/50 border border-indigo-100 space-y-1">
                                                            <div className="flex justify-between items-center">
                                                                <span className="text-xs font-bold text-indigo-950">공실 입점 최우선 권장 업종</span>
                                                                <span className="text-[11px] font-bold text-emerald-700">{currentCommAnalysis.synergy}</span>
                                                            </div>
                                                            <div className="text-slate-900 font-bold text-xs">{currentCommAnalysis.bestCategory}</div>
                                                            <p className="text-slate-600 text-[11px] leading-relaxed">{currentCommAnalysis.reason}</p>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* 4. 정책 슬라이더 조작 영역 */}
                                            <div className="space-y-3 pt-1">
                                                {/* 셔틀 조작기 */}
                                                <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-1.5">
                                                    <div className="flex justify-between items-center">
                                                        <label className="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                                                            <IconBus className="w-3.5 h-3.5 text-slate-600" />
                                                            2. 주말 직통 관광 셔틀 투입 대수
                                                        </label>
                                                        <span className="text-xs font-bold text-slate-900 bg-white border border-slate-300 px-2 py-0.5 rounded">
                                                            {shuttleCount}대
                                                        </span>
                                                    </div>
                                                    <input type="range" min="1" max="5" value={shuttleCount}
                                                        onChange={(e) => setShuttleCount(Number(e.target.value))}
                                                        className="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-slate-800" />
                                                    <div className="flex justify-between text-[10px] text-slate-400">
                                                        <span>1대 (70분)</span>
                                                        <span>2대 (35분)</span>
                                                        <span>3대 (23분)</span>
                                                        <span>5대 (15분)</span>
                                                    </div>
                                                </div>

                                                {/* 상권 업종 및 점포 수 조작기 */}
                                                <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2">
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-800 mb-1 flex items-center gap-1.5">
                                                            <IconStore className="w-3.5 h-3.5 text-slate-600" />
                                                            3. 500m~1km 보행 벨트 지원 업종
                                                        </label>
                                                        <select value={storeCategory} onChange={(e) => setStoreCategory(e.target.value)}
                                                            className="w-full p-2 border border-slate-300 rounded bg-white text-slate-900 font-medium text-xs">
                                                            <option value="craft_shop">[로컬 특화] 청년 해양 공방 & 로컬 굿즈 편집숍</option>
                                                            <option value="local_fnb">[로컬 특화] 거제 특산물 F&B (유자/해양 타파스)</option>
                                                            <option value="culture_book">[로컬 특화] 독립 서점 & 로컬 복합 문화공간</option>
                                                            <option value="franchise_copy">[복제 업종] 전국 프랜차이즈 / 무인 사진관</option>
                                                        </select>
                                                    </div>

                                                    <div className="pt-1">
                                                        <div className="flex justify-between items-center mb-1">
                                                            <span className="text-xs font-bold text-slate-700">4. 지원 점포 수</span>
                                                            <span className="text-xs font-bold text-slate-900 bg-white border border-slate-300 px-2 py-0.5 rounded">
                                                                {storeCount}개소
                                                            </span>
                                                        </div>
                                                        <input type="range" min="1" max="5" value={storeCount}
                                                            onChange={(e) => setStoreCount(Number(e.target.value))}
                                                            className="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-slate-800" />
                                                    </div>
                                                </div>
                                            </div>

                                            {/* 5. 시뮬레이션 실행 버튼 (Deep Navy Professional) */}
                                            <button onClick={runFusionSimulation}
                                                className="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs md:text-sm rounded-lg shadow transition flex items-center justify-center gap-2">
                                                <IconTrendingUp className="w-4 h-4 text-slate-200" />
                                                <span>TII × CEI 융합 정책 시뮬레이션 실행</span>
                                            </button>

                                            {/* 6. 시뮬레이션 결과 카드 (깔끔한 메트릭스 & 체류시간 강조) */}
                                            {fusionResult && (
                                                <div className="bg-white border border-slate-200 p-4 rounded-xl shadow-sm space-y-3 mt-2">
                                                    <div className="text-slate-800 text-xs leading-relaxed bg-slate-50 p-2.5 rounded border border-slate-200">
                                                        <strong className="text-slate-900">[{fusionResult.spotName.split(' - ')[0]}]</strong> 직통 셔틀 {shuttleCount}대 투입 및 반경 500m~1km 내 '{fusionResult.categoryName}' {fusionResult.storeCount}개소 연계 지원 시 종합 효과
                                                    </div>

                                                    {/* 핵심 지표 그리드 */}
                                                    <div className="grid grid-cols-2 gap-2.5">
                                                        <div className="p-2.5 rounded-lg border border-slate-200 bg-slate-50/50">
                                                            <span className="text-[11px] text-slate-500 font-medium">TII 고립도 개선:</span>
                                                            <div className="text-sm font-bold text-slate-900 mt-0.5">
                                                                {fusionResult.origTii} → {fusionResult.newTii}
                                                                <span className="text-xs text-rose-700 ml-1">(-{fusionResult.tiiImprovePct}%)</span>
                                                            </div>
                                                            <div className="text-[10px] text-slate-400 mt-0.5">배차 {fusionResult.origInterval}분 → {fusionResult.newInterval}분</div>
                                                        </div>

                                                        <div className="p-2.5 rounded-lg border border-slate-200 bg-slate-50/50">
                                                            <span className="text-[11px] text-slate-500 font-medium">상권 다양성(CEI):</span>
                                                            <div className="text-sm font-bold text-slate-900 mt-0.5">
                                                                {fusionResult.origCei} → {fusionResult.newCei}
                                                                <span className="text-xs text-indigo-700 ml-1">(+{fusionResult.ceiChangePct}%)</span>
                                                            </div>
                                                            <div className="text-[10px] text-slate-500 mt-0.5 font-medium">500m~1km 내 공실 {fusionResult.storeCount}개소 청년 창업</div>
                                                        </div>

                                                        {/* 체류시간 증가치 (굵은 타이포그래피) */}
                                                        <div className="p-3 rounded-lg border border-slate-300 bg-slate-50 col-span-2">
                                                            <div className="flex justify-between items-center">
                                                                <span className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                                                                    <IconTrendingUp className="w-3.5 h-3.5 text-slate-700" />
                                                                    체류시간 증가 추정 (회귀식):
                                                                </span>
                                                                <span className="text-xl font-extrabold text-slate-900 tracking-tight">
                                                                    +{fusionResult.totalStayGain}분
                                                                    <span className="text-xs font-semibold text-slate-600 ml-1.5">
                                                                        (약 +{(fusionResult.totalStayGain / 60).toFixed(1)}시간)
                                                                    </span>
                                                                </span>
                                                            </div>
                                                            <div className="text-[10px] text-slate-400 font-mono mt-1 border-t border-slate-200/80 pt-1">
                                                                {fusionResult.formulaText}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {/* 최하단 자문서 생성 버튼 (전문적인 네이밍 & 모델명 제거) */}
                                                    <button onClick={generateAiReport}
                                                        className="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs md:text-sm rounded-lg shadow-sm transition flex items-center justify-center gap-2">
                                                        <IconFileText className="w-4 h-4 text-slate-200" />
                                                        <span>AI 기반 정책 의사결정 자문서 생성</span>
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* [단독 탭 2] 교통 단독 */}
                                    {activeTab === 'traffic' && (
                                        <div className="space-y-3 p-4 bg-slate-50 rounded-lg border border-slate-200 text-xs">
                                            <div className="font-bold text-slate-900 flex items-center gap-1.5">
                                                <IconBus className="w-4 h-4 text-slate-700" />
                                                도심 ↔ 외곽 관광 셔틀 단독 분석
                                            </div>
                                            <div>
                                                <label className="block text-slate-700 mb-1 font-medium">대상 고립지:</label>
                                                <select value={selectedSpotId} onChange={(e) => handleSelectSpot(e.target.value)}
                                                    className="w-full p-2 border border-slate-300 rounded bg-white text-slate-900 font-medium">
                                                    <option value="maemi_castle">매미성 (장목면)</option>
                                                    <option value="wind_hill">바람의 언덕 (남부면)</option>
                                                    <option value="hakdong_pebble">학동 흑진주 몽돌해변 (동부면)</option>
                                                    <option value="geoje_jungle_dome">거제 정글돔 (거제면)</option>
                                                </select>
                                            </div>
                                            <p className="text-[11px] text-slate-500">교통과 상권을 복합 진단하려면 <strong>[TII × CEI 융합 정책]</strong> 탭을 권장합니다.</p>
                                        </div>
                                    )}

                                    {/* [단독 탭 3] 상권 단독 */}
                                    {activeTab === 'commercial' && (
                                        <div className="space-y-3 p-4 bg-slate-50 rounded-lg border border-slate-200 text-xs">
                                            <div className="font-bold text-slate-900 flex items-center gap-1.5">
                                                <IconStore className="w-4 h-4 text-slate-700" />
                                                상권 엔트로피(CEI) 다양성 단독 분석
                                            </div>
                                            <div>
                                                <label className="block text-slate-700 mb-1 font-medium">대상 상권:</label>
                                                <select value={currentProfile.town} onChange={() => {}}
                                                    className="w-full p-2 border border-slate-300 rounded bg-white text-slate-900 font-medium">
                                                    <option value="장목면">장목면 (매미성 1km 상권)</option>
                                                    <option value="남부면">남부면 (바람의 언덕 1km 상권)</option>
                                                    <option value="동부면">동부면 (몽돌해변 1km 상권)</option>
                                                </select>
                                            </div>
                                            <p className="text-[11px] text-slate-500">교통과 상권을 복합 진단하려면 <strong>[TII × CEI 융합 정책]</strong> 탭을 권장합니다.</p>
                                        </div>
                                    )}
                                </div>

                                <div className="pt-3 border-t border-slate-200 text-[11px] text-slate-400 text-center mt-3">
                                    한국관광 데이터랩 경진대회 출품작 | 거제시 B2G 정책 시나리오 모델
                                </div>
                            </div>

                        </div>
                    </main>

                    {/* AI 정책 제언서 팝업 모달 (전문 공문서 스타일, z-index 99999 보장) */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in"
                            style={{ zIndex: 99999 }}>
                            <div className="bg-white rounded-xl shadow-xl max-w-3xl w-full max-h-[90vh] flex flex-col overflow-hidden border border-slate-300">
                                
                                {/* 모달 헤더 */}
                                <div className="bg-slate-900 text-white p-4 flex justify-between items-center border-b border-slate-800">
                                    <div className="flex items-center space-x-2.5">
                                        <IconFileText className="w-5 h-5 text-indigo-300" />
                                        <div>
                                            <h3 className="font-bold text-sm md:text-base">거제시정 반영용 AI 관광·교통 융합 정책 자문서</h3>
                                            <p className="text-[11px] text-slate-300">한국관광 데이터랩 공모전 [서식 4] 표준 지자체 공문서 포맷</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setIsModalOpen(false)}
                                        className="text-slate-400 hover:text-white text-xl font-bold px-2 py-1">&times;</button>
                                </div>

                                {/* 로딩 인디케이터 */}
                                {isReportLoading ? (
                                    <div className="p-16 text-center space-y-4">
                                        <div className="animate-spin rounded-full h-12 w-12 border-3 border-slate-800 border-t-transparent mx-auto"></div>
                                        <div className="text-sm font-bold text-slate-800">TII×CEI 실측 기준지표와 정책효과 추정식을 바탕으로 자문서 작성 중...</div>
                                        <div className="text-xs text-slate-500">외곽 관광지 교통 단절 해소 및 500m~1km 보행 벨트 상권 조례안 도출</div>
                                    </div>
                                ) : (
                                    /* 본문 내용 */
                                    <div className="flex-1 overflow-y-auto p-6 text-slate-800 bg-white">
                                        <div id="reportHtmlArea" 
                                            className="prose max-w-none text-slate-800 leading-relaxed text-sm"
                                            dangerouslySetInnerHTML={{ __html: marked.parse(reportMarkdown) }} />
                                    </div>
                                )}

                                {/* 모달 푸터 */}
                                <div className="bg-slate-50 border-t border-slate-200 p-3.5 flex justify-between items-center">
                                    <span className="text-xs text-slate-500 font-medium">B2G 거제시정 맞춤형 정책 의사결정 증빙자료</span>
                                    <div className="space-x-2">
                                        <button onClick={copyReportText}
                                            className="bg-slate-900 hover:bg-slate-800 text-white font-medium py-1.5 px-3 rounded text-xs transition">
                                            전문 복사
                                        </button>
                                        <button onClick={() => setIsModalOpen(false)}
                                            className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-1.5 px-3 rounded text-xs transition">
                                            닫기
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    {% endraw %}
</body>
</html>
